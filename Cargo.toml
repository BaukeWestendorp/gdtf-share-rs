[package]
name = "gdtf-share"
version = "0.1.0"
edition = "2024"
description = "Library for interacting with the GDTF Share API."
repository = "https://github.com/BaukeWestendorp/gdtf-share-rs"
license = "MIT"
keywords = ["dmx", "gdtf", "mvr"]
categories = ["api-bindings", "asynchronous"]

[[example]]
name = "blocking"
required-features = ["client"]

[[example]]
name = "async"
required-features = ["async", "client"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# feature = "client"
ehttp = { version = "0.7.1", optional = true }
uuid = { version = "1.26.1", features = ["serde"] }

[dev-dependencies]
dotenv = "0.15.0"
smol = "2.0.2"

[features]
default = []
async = ["client", "ehttp/native-async"]
client = ["dep:ehttp"]
